server:
  port: 8083

spring:
  application:
    name: ai-service
  mongodb:
    uri: ${MONGODB_RECOMMENDATION_URI}
    database: fitnessrecommendation

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

rabbitmq:
  exchange:
    name: fitness.exchange
  queue:
    name: activity.queue
  routing:
    key: activity.tracking

gemini:
  api:
    url: ${GEMINI_API_URL}
    key: ${GEMINI_API_KEY}