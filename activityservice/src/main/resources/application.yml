server:
  port: 8082

spring:
  application:
    name: activity-service

  mongodb:
    uri: ${MONGODB_ACTIVITY_URI}
    database: fitnessactivity

  rabbitmq:
    addresses: ${RABBITMQ_URL}

eureka:
  instance:
    appname: activity-service
    hostname: localhost
    virtual-host-name: activity-service
    secure-virtual-host-name: activity-service

  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

rabbitmq:
  exchange:
    name: fitness.exchange
  queue:
    name: activity.queue
  routing:
    key: activity.tracking